# Pinned profile for the 50-job AI-filter benchmark (tests/test_ai_filter_benchmark_50.py).
#
# Snapshot of config/profile.yaml on main (2026-09-17) with ONE deliberate
# difference: matching.mandatory_central_skill_gate is true, as it was when the
# ground-truth labels were committed (40d026e) and as the JobSearchProfile
# model defaults it. A personal-preferences commit 15 seconds later (07d6e6b)
# turned the gate off, so bm50 (Rust-centred role behind a generic title)
# passed and the hard-constraint floor failed even though extraction and the
# gate were correct (issue #18). With this file, the deterministic path
# reproduces every hard-constraint-trap label, independent of anyone's
# personal configuration.
#
# Do not edit to make a benchmark result change; update the labels instead.
