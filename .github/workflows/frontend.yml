name: Frontend

# Type-checks, lints, builds and unit-tests the React/Vite frontend.
# Runs on every pull request and push to main, with no path filter: its job
# (`frontend`) is a required check on main, and GitHub leaves a required check
# from a path-filtered workflow pending forever, which blocks every pull request
# that does not touch frontend/. Running always also re-checks npm advisories,
# which change without any commit here. Costs about a minute per run.
#
# Reproduce locally: cd frontend && npm ci && npm run lint && npx tsc -b && npx vite build && npm test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --ignore-scripts: no dependency's install hook runs in CI.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint (oxlint)
        run: npm run lint

      - name: Type-check (tsc -b)
        run: npx tsc -b

      - name: Build (vite)
        run: npx vite build

      - name: Unit tests (Vitest)
        run: npm test

      # Fails on known high/critical advisories in the dependencies the
      # dashboard ships (dev tooling is reported but not blocking).
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
