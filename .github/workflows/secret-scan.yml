name: Secret scan

# Scans the commits a pull request (or a push to main) introduces for
# accidentally committed secrets, using the MIT-licensed Gitleaks CLI with
# the rules in .gitleaks.toml (defaults + a Discord webhook URL rule).
# Only new commits are scanned: history before this workflow is covered by
# a one-off audit (see issue #11), and rewriting history is not planned.
#
# On a finding: revoke/rotate the secret FIRST, then remove it from the
# branch. Output is redacted (--redact) so logs never print the value.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz from the
  # release's checksums.txt — update both together.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks (checksum-verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Determine commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE"
          fi
          # A zero/unknown base (e.g. first push) falls back to scanning HEAD only.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "log_opts=-1" >> "$GITHUB_OUTPUT"
          else
            echo "log_opts=${base}..HEAD" >> "$GITHUB_OUTPUT"
          fi

      # The range reaches the script through env, not ${{ }} expansion, so
      # no expression value is ever spliced into shell code.
      - name: Scan new commits
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          gitleaks git --config .gitleaks.toml --redact --verbose --no-banner \
            --log-opts="$LOG_OPTS" .

