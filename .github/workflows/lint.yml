name: Lint

# Ruff over src/ and tests/ using the rules pinned in pyproject.toml.
# ADVISORY: findings are annotated on the PR and summarized, but the job
# never fails while the documented baseline (docs/baselines/ruff.md) is
# burned down — see issue #14. Make it blocking once the count is zero.
# Path-filtered: only Python sources and their config can change the result.
# Drop the filter if this check is ever made required (a skipped required
# check blocks merging).
#
# Reproduce locally: ruff check src tests
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/lint.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Pinned so the finding count only changes when the code does.
      - name: Install Ruff
        run: pip install "ruff==0.16.2"

      - name: Ruff check (annotations, advisory)
        run: ruff check src tests --output-format github --exit-zero

      - name: Ruff statistics (job summary)
        run: |
          {
            echo "### Ruff findings (advisory, baseline: docs/baselines/ruff.md)"
            echo '```'
            ruff check src tests --statistics --exit-zero
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
