name: Dependency audit

# Python side of the dependency checks (the frontend job runs npm audit).
# Installs what a user installs - the package with its optional "linkedin"
# extra, which the Tests workflow leaves out - then:
#   1. pip-audit: fails on any known advisory in the installed packages;
#   2. the tests that only run with python-jobspy/pandas installed, so the
#      LinkedIn scanner is checked against the jobspy version users get.
# Runs on every pull request, on main, and weekly: advisories are published
# without any commit here.
#
# Not covered: the "browser" extra (crawl4ai, inactive by default) and the
# CPU torch wheel, whose "+cpu" version pip-audit cannot look up on PyPI.
#
# Reproduce locally:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
#   pip install --upgrade setuptools
#   pip install -e ".[dev,linkedin]" "pip-audit==2.10.1"
#   pip-audit --skip-editable
#   pytest -m "not network" tests/test_quality_fixes.py tests/test_linkedin_description_workmode.py tests/test_linkedin_scanner.py
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Same as the Tests workflow: the default Linux torch wheel pulls several
      # GB of CUDA libraries nothing here uses.
      # torch requires setuptools on Python 3.12+, and the PyTorch index serves
      # an old copy (78.1.0, with advisories); the README's plain
      # `pip install -e .` takes torch and setuptools from PyPI, current. Upgrade it here so
      # the audit reflects the user's install, not this CI shortcut.
      - name: Install CPU-only torch
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install --upgrade setuptools

      - name: Install the package with the linkedin extra
        run: pip install -e ".[dev,linkedin]" "pip-audit==2.10.1"

      - name: Installed python-jobspy and markdownify
        run: pip show python-jobspy markdownify | grep -E "^(Name|Version)"

      - name: pip-audit
        run: pip-audit --skip-editable --progress-spinner off

      - name: LinkedIn tests that need python-jobspy / pandas
        if: ${{ !cancelled() }}
        run: >-
          pytest -m "not network"
          tests/test_quality_fixes.py
          tests/test_linkedin_description_workmode.py
          tests/test_linkedin_scanner.py
