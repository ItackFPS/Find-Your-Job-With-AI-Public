name: Feature
description: New behavior or capability.
title: "feat: "
labels: ["type:feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should become possible, and why it matters.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Affected pipeline stages / src/ packages / frontend pages, related issues or decisions.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable, testable conditions.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Scope / non-goals
      description: What is explicitly out of scope. If the work spans several stages, list the slices.
    validations:
      required: true
