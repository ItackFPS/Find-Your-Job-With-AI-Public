# Scheduler configuration for Find Your Job With AI.
#
# Each entry defines one scheduled background job.
# The scheduler reads this file on startup and upserts definitions into SQLite.
#
# Shipped default: both scans run daily ONLY for a source you chose (startup_policy:
# when_opted_in, plan rule I1). LinkedIn and HelloWork are unofficial sources: off on a
# fresh install, so a first start never sends queries built from the example profile.
# You choose a source in data/settings.json ("unofficial_sources": {"linkedin": true});
# an install that already ran a scan of a source counts as having chosen it. "Scan now"
# on the dashboard always works.
#
# startup_policy options:
#   run_once_per_day  — trigger a run on backend startup if no successful run
#                       has occurred today (UTC midnight boundary).
#                       Also re-triggers automatically when a UTC day rolls over
#                       while the backend is running.
#   when_opted_in     — run_once_per_day for a source the user chose; disabled otherwise.
#   when_profile_saved — run_once_per_day once the user saved their own profile
#                       (config/profile.local.yaml); disabled before.
#   disabled          — never run automatically (manual trigger only).
#
# Rate limits (F6.4): a scan stopped on the source's first 429 waits out a cooldown
# (1 h, doubled per consecutive rate-limited attempt, at most 24 h), then resumes from
# its checkpoint, more slowly at first. It is not a failure and uses no retry.
#
# Retries (per UTC day, see src/scheduler/service.py):
#   retry_max            — automatic retries allowed after a FAILED attempt
#                          (0 = none until the next UTC day).
#   retry_delay_seconds  — wait before the first retry; doubles for each
#                          further failure (capped at 6 h).
#   A scan stopped by a backend shutdown/restart is "interrupted", not failed:
#   it resumes from its checkpoint on the next start and uses no retry.
#   A manual "run now" always runs.
#
# Timezones: all scheduling uses UTC.  The "day" boundary is UTC midnight.

schedules:
  - id: pipeline_daily
    source_id: pipeline
    label: "Daily search"
    enabled: true
    # The main pipeline: collects the official/public sources (and any unofficial
    # source the user chose), then filters and scores. Once per UTC day; after days
    # with the app closed, one run catches up. It waits while a scan runs, and a
    # completed scan starts it through this schedule (issue #76).
    startup_policy: when_profile_saved
    retry_max: 1                       # one automatic retry after a failure
    retry_delay_seconds: 1800

  - id: linkedin_daily
    source_id: linkedin
    label: "LinkedIn daily scan"
    enabled: true
    startup_policy: when_opted_in      # daily once LinkedIn is chosen; manual before
    retry_max: 0                       # no automatic retry on failure
    retry_delay_seconds: 300

  - id: hellowork_daily
    source_id: hellowork
    label: "HelloWork daily scan"
    enabled: true
    # Runs decoupled from the main pipeline run, same as LinkedIn above --
    # ~30 minutes for the full metier taxonomy (see src/hellowork/scanner.py
    # and src/collectors/hellowork.py). The scheduler auto-triggers a
    # pipeline run after this completes, which snapshots the staged jobs
    # in ~0s (src/api/runner.py) rather than waiting on a live collection.
    startup_policy: when_opted_in      # daily once HelloWork is chosen; manual before
    retry_max: 0
    retry_delay_seconds: 300

  # Future entries (uncomment and implement the corresponding handler):
  # - id: indeed_daily
  #   source_id: indeed
  #   label: "Indeed daily scan"
  #   enabled: false
  #   startup_policy: run_once_per_day
  #   retry_max: 0
  #   retry_delay_seconds: 300
