# Phase LATER / I13: pipeline-history retention.
#
# This ONLY prunes pipeline_runs, job_scores, and job_rejections rows — the
# operational/audit trail of past pipeline executions. It NEVER deletes rows
# from the `jobs` table (current/active job listings are never affected,
# regardless of how old the run that collected them was).
#
# A run is deleted only once it is BOTH older than retention_days AND not
# among the keep_min_runs most recently started runs — so the run-history
# UI (which lists/queries individual past runs) never loses a run it might
# still be showing, even if that run is old.

# How many days of pipeline-run history to keep, at minimum, by age.
retention_days: 30

# Always keep at least this many of the most recent runs, regardless of
# their age — matches (with headroom) the largest page size the frontend's
# run-history view requests, so retention can never delete a run the UI is
# currently able to list.
keep_min_runs: 100

# Offer expiry (issue #86): an active offer no longer listed by a source that was fully
# collected (completed, not capped) this many runs in a row is marked expired ("no longer
# listed in recent searches"). It is hidden from the default lists, never deleted here,
# and active again if seen again. LinkedIn and HelloWork scans never count a miss.
expire_after_missed_runs: 3
