# IT line-of-work preset.
#
# Vocabulary for information-technology profiles (search terms, scoring hints,
# Stats page groupings), kept here so the code carries no profession-specific
# terms. It applies when the profile's target_domains contains one of
# applies_to_domains (case-insensitive). Add your own preset for another line of
# work as another file in this folder: same keys, your own applies_to_domains.
#
# discovery.baseline            queries always sent to a source while the preset applies
# discovery.domain_queries      extra France Travail / APEC queries per selected domain
# discovery.contract_queries    extra queries per contract type
# discovery.jobicy_industries   Jobicy industry slugs per selected domain
# discovery.partition_*         terms used to split a saturated France Travail query
# discovery.noisy_replacements  query -> safer query (null rejects the query)
# discovery.collector_config    per source type: collector config keys (queries, categories,
#                               occupations...) used when config/sources.yaml leaves them out
# scoring.broad_title_indicators  title words that make an unmatched title a mid-tier role
#                               guess in domain_relevance scoring (0.35 instead of 0.45)
# stats.technologies_only       Stats page: keep only known technology names as skills
# stats.tool_keywords           technologies the Stats page lists as tools, not skills
# stats.title_categories        Stats page: title buckets (name + keywords)
