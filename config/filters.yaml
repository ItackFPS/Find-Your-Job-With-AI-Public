# ---------------------------------------------------------------------------
# Domain-specific SKILL/TOOL vocabulary (2026-09-11)
#
# Distinct from `domain_keywords` above: those are ROLE-title synonyms used
# to detect whether a job IS in a given domain. This section is a small,
# curated list of actual TOOL/TECHNOLOGY terms per domain, used ONLY by the
# deterministic scorer's skills_match fallback (src/pipeline/scoring.py,
# _score_skills_match) to give a confirmed in-domain job partial credit when
# it mentions real domain-specific technology but none of the candidate's
# own `profile.target_skills` — e.g. a cybersecurity job mentioning "SIEM"
# or "pentest" when the candidate's skill list is python/js/docker/etc.
#
# IMPORTANT — this is NOT added to target_skills and never appears as a
# "matched skill" in the UI (frontend/src/pages/Jobs.tsx, src/pipeline/
# explain.py's `_matched_skills`): it would misrepresent the candidate as
# knowing a tool they never listed. It only nudges the deterministic score's
# skills_match fallback tier, and only when the job's domain is already
# CONFIRMED (domain_relevance >= fallback_domain_threshold) — see
# scoring.yaml's `domain_vocab_bonus` comment for the exact, bounded effect.
#
# Only cover domains whose real vocabulary structurally can't overlap with
# a general software/web-dev target_skills list: cybersecurity, networking,
# systems, devops, automation. Same false-positive discipline as
# domain_keywords' description lists — unambiguous multi-word terms
# preferred over short/ambiguous acronyms.
# ---------------------------------------------------------------------------

domain_skill_vocabulary:

  cybersecurity:
    - siem
    - soc
    - pentest
    - penetration testing
    - firewall
    - pare-feu
    - active directory
    - iam
    - pki
    - waf
    - ids/ips
    - edr
    - vulnerability assessment
    - threat intelligence
    - soar

  networking:
    - tcp/ip
    - vlan
    - routing
    - switching
    - firewall
    - vpn
    - dns
    - dhcp
    - wan
    - lan
    - cisco
    - fortinet
    - load balancer

  systems:
