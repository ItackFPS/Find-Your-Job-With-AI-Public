# ---------------------------------------------------------------------------
# Contract type keyword vocabulary
#
# When a contract type is selected in the profile, its title keywords are
# added to the title matching list.
# Description lists are intentionally empty — contract keywords are too
# ambiguous for free-form text matching (e.g. "stage" matches "staged",
# "intern" matches the French word "interne" meaning "internal").
# ---------------------------------------------------------------------------

contract_keywords:

  internship:
    title:
      - internship
      - "intern "
      - stagiaire
      - stage
      - apprenticeship
      - apprentice
      - placement
    description: []

  alternance:
    title:
      - alternance
      - alternant
      - apprentissage
      - apprenti
    description: []

  cdi:
    title: []
    description: []

  cdd:
    title: []
    description: []

  # Unlike the other groups above (added to matching when the contract type
  # IS selected), freelance's title keywords are used in the opposite
  # direction: as a REJECTION list when "freelance" is NOT in the profile's
  # contract_types — see build_filter_config()'s contract_type section and
  # matches_contract_type() in src/pipeline/filter.py.
  freelance:
    title:
      - freelance
      - indépendant
      - independant
      - auto-entrepreneur
      - portage salarial
    description: []

# ---------------------------------------------------------------------------
# Seniority exclusion keyword sets
#
# Profile.experience.excluded_seniority lists which sets to activate.
# A job whose title contains any keyword from an active set is rejected.
# ---------------------------------------------------------------------------

seniority_exclusions:
  senior:
    - senior
    # "Sr." / "Sr " — English abbreviation for Senior (e.g. "Sr. DevOps Engineer").
    # The filter applies word-boundary guards ((?<![a-z0-9])kw(?![a-z0-9])), so bare
    # "sr" will NOT match inside words like "master" or "observer" but WILL match
    # "sr. devops engineer" (period after) and "sr software" (space after).
    - sr
    # French seniority equivalents (accent-stripped; matched after _normalize()).
    # "sénior" normalises to "senior" and is already caught by the entry above.
    - confirme
    - confirmee
    - experimente
    - experimentee
  director:
    - director
    - "head of"
    - head
    - directeur
    - directrice
  vp:
    - "vice president"
    - "vp"
    - "vice-président"
    - "vice-president"
    - "vice président"
  c_suite:
    - "chief"
    - cto
    - ciso
    - coo
    - cpo
  lead:
    - lead
    - leader
    - "tech lead"
    - "team lead"
    - "lead developer"
    - "lead engineer"
    - "lead software"
    - "lead data"
    - "engineering lead"
    - "development lead"
    - "lead développeur"
    - "lead developpeur"
    - "lead ingénieur"
    - "lead ingenieur"
    - "développeur lead"
    - "developpeur lead"
    - "ingénieur lead"
    - "ingenieur lead"
  manager:
    - manager
    - manageur
    - responsable
    - "chef de projet"
    - "chef de produit"
  principal:
    - principal
    - "principal engineer"
    - "principal developer"
    - "principal software"
    - "principal architect"
    - "principal data"
    - "ingénieur principal"
    - "développeur principal"
  staff:
    - "staff engineer"
    - "staff developer"
    - "staff software"
    - "staff data"
    # DevOps/Cloud/Platform role-type variants (same "staff" IC-level
    # signal as the entries above, extended to match the automation
    # domain's cloud/devops/platform vocabulary — see build_filter_config).
    # Deliberately no bare "staff" keyword here, unlike "principal" below:
    # "staff" alone is a much more common/ambiguous English word (e.g.
    # generic "IT Staff" usage) that would risk rejecting legitimate
