# ---------------------------------------------------------------------------
# Title keywords that always indicate a clearly non-IT role — grouped by the
# domain that opts back into that category (see the non-IT domains added to
# domain_keywords above). build_filter_config() applies a group's keywords
# only when the user has NOT selected the matching domain, so an IT-only
# profile (no group key present in target_domains) sees exactly the same
# rejections as before this was split into groups.
#
# Keep each group small and conservative: false negatives are worse than
# false positives at the hard-filter stage.
# ---------------------------------------------------------------------------

excluded_title_keywords:
  accounting:
    - comptable
  legal:
    - juriste
  healthcare:
    - infirmier
    - infirmière
    - infirmiere
    - pédiatre
    - pediatre
    - médecin
    - medecin
    - pharmacien
    - kiné
    - kine
    # Added 2026-09-12 (Pass 5.1 vocabulary audit): "aide-soignant" was
    # already in domain_keywords.healthcare's title list (used if a user
    # opts INTO the healthcare domain) but missing here, so it fell through
    # to the neutral "undetermined" domain score (0.45) instead of
    # "confirmed wrong" (0.05) for an IT-only profile — unambiguous medical
    # role, zero overlap with any IT title.
    - aide-soignant
    - aide-soignante
    - aide soignante
  trades:
    - plombier
    - carrossier
    - électricien
    - electricien
    - chaudronnier
    - soudeur
    - maçon
    - macon
  # Manual-labor roles — never IT regardless of description wrapper content.
  manual_labor:
    - ouvrier
    - ouvrière
    - ouvriere
    - manutentionnaire
    - agent de production
  # Added 2026-09-12 (Pass 5.1 vocabulary audit): construction/civil-
  # engineering roles beyond the single-trade words already covered above
  # (plombier, électricien, maçon, ...) — e.g. "Ingénieur BTP" and
  # "Conducteur de Travaux" postings were landing at the neutral
  # "undetermined" domain score (0.45) rather than "confirmed wrong" (0.05)
  # purely because their titles contain no SPECIFIC trade word. Deliberately
  # NOT "chef de chantier" alone reduced to bare "chef" or "chantier" —
  # both are common, ambiguous words that would risk false-positiving on
  # legitimate IT titles ("Chef de Projet", "Chantier informatique" is not
  # real but "chef" alone is far too broad). "btp" is the standard,
  # unambiguous French construction-sector acronym with no known IT title
  # overlap.
  construction:
    - conducteur de travaux
    - chef de chantier
    - génie civil
    - genie civil
    - btp
  # Added 2026-09-12 (Pass 5.1 vocabulary audit): hospitality/restaurant
  # service roles. Deliberately does NOT include bare "serveur" — a real,
  # common French IT title pattern is "Administrateur Serveurs",
  # "Technicien Serveurs et Réseaux", "Ingénieur Serveurs" (server
  # infrastructure) and a blanket "serveur" exclusion would hard-reject
  # those legitimate IT jobs. Only qualified phrases that unambiguously mean
  # the hospitality role are included; a bare "Serveur"/"Serveur Junior"
  # title with no restaurant/salle qualifier remains uncovered by design —
  # see the Pass 5.1 report for this documented, intentional gap.
  hospitality:
    - commis de cuisine
    - chef de rang
    - employé de restaurant
    - employe de restaurant
    - serveur de restaurant
    - serveur en salle
    - commis de salle
    - plongeur
  # Added 2026-09-12 (Pass 5.1 vocabulary audit): agriculture, no prior
  # coverage at all (neither an opt-in domain nor an exclusion group
  # existed). "ouvrier agricole" was already implicitly covered by the
  # bare "ouvrier" entry in manual_labor above.
  agriculture:
    - agriculteur
    - exploitant agricole

# ---------------------------------------------------------------------------
# Non-IT title function words — same grouping/opt-out mechanism as above.
#
# When a job title fails the IT keyword inclusion check AND contains one of
# these words, the description fallback is skipped.  IT keywords in the
# description of a recruiter, sales, or HR role are incidental ("we hire
# developers") and must not be used to classify the posting as IT-relevant
# for a profile that hasn't opted into that domain.
#
# Keep each group conservative: only add words that NEVER identify a
# legitimate IT job function, regardless of surrounding context.
# ---------------------------------------------------------------------------

non_it_title_functions:
  recruitment:
    - recruiter
    - recruteur
    - recrutrice
    - recrutement
  # Sales — word-boundary matching prevents "commercial" from false-positiving
  # on "commerciales" or "commercialisation" in longer French titles.
  sales:
    - vendeur
    - vendeuse
    - commercial         # "Commercial informatique" = sales, not IT
    - conseiller de vente  # "Conseiller de vente informatique" = retail advisor
    # Added 2026-09-12 (Pass 5.1 vocabulary audit): English equivalents —
    # the French sales-function terms above were already covered, but
    # "Account Executive"/"Sales Representative"/"Business Developer"
    # (a real, common title on English-language job boards) were not,
    # despite "business developer" already appearing in domain_keywords.
    # sales's title list (used only if a user opts INTO the sales domain).
    # Each is an unambiguous 2+ word sales/BD phrase with no legitimate IT
    # title overlap.
    - account executive
    - sales representative
    - business developer
  procurement:
    - acheteur
  marketing:
    - marketeur

