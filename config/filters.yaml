# Filtering engine vocabulary
#
# This file maps domain names, contract types, and seniority labels to
# concrete matching keywords used by the filter engine.
#
# WHO EDITS THIS FILE:
#   This file is engine configuration.  Users change their preferences in
#   config/profile.yaml.  Edit this file only when you need to add new
#   keyword synonyms or expand the vocabulary for a domain.
#
# STRUCTURE:
#   domain_keywords   — per-domain keyword lists (title and description tiers)
#   contract_keywords — per-contract-type keyword lists
#   seniority_exclusions — per-label keyword lists for hard seniority exclusions
#   excluded_title_keywords — clearly non-IT role terms (always rejected)
#   remote_scope      — geographic constants for the location filter

# ---------------------------------------------------------------------------
# Domain keyword vocabulary
#
# Each domain has two sub-lists:
#   title       — used to match against job titles (broader, allows common
#                 substrings because title context limits false positives)
#   description — used as a fallback when the title does not match; must
#                 contain ONLY unambiguous IT terms to avoid false positives
#                 from substring matching in free-form text
#                 (e.g. "intern" matches "interne" in French descriptions)
# ---------------------------------------------------------------------------

